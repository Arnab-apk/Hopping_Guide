name: Uma
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
  StreamVideo:
    url: https://github.com/GetStream/stream-video-swift.git
    from: 1.40.0
options:
  bundleIdPrefix: app.uma
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  Uma:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Uma
    info:
      path: Uma/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "To show your location and walking routes on the map."
        NSCameraUsageDescription: "To share video during squad group video calls."
        NSMicrophoneUsageDescription: "To speak with your squad during group video calls."
        VIDEO_API_URL: "https://uma-group-calling.onrender.com"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes: []
        CFBundleDisplayName: Uma
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        UIAppFonts:
          - Samarkan.ttf
          - HindSiliguri-Regular.ttf
          - HindSiliguri-Medium.ttf
          - HindSiliguri-SemiBold.ttf
          - HindSiliguri-Bold.ttf
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: StreamVideo
        product: StreamVideo
      - package: StreamVideo
        product: StreamVideoSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.uma.Uma
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Uma/Resources"'
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DPW6RLZ3RW
        SWIFT_EMIT_LOC_STRINGS: "YES"

  UmaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UmaTests
    dependencies:
      - target: Uma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.uma.UmaTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Uma:
    build:
      targets:
        Uma: all
        UmaTests: [test]
    test:
      targets:
        - UmaTests
    run:
      config: Debug
