name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app # Flutter project lives in app/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Setup CI Firebase placeholders (if missing)
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            echo "Copying template to lib/firebase_options.dart for CI"
            cp lib/firebase_options.template.dart lib/firebase_options.dart
          fi
          if [ ! -f android/app/google-services.json ]; then
            echo "Creating dummy google-services.json for CI"
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "1034026195231",
              "project_id": "kolkata-puja-2026",
              "storage_bucket": "kolkata-puja-2026.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1034026195231:android:ffe9cec9fe348339cbb82a"
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy-ci-key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (lint)
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
